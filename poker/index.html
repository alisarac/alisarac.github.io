<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e1116">
<title>Texas Hold'em</title>
<style>
  html,body{margin:0;height:100%;background:#0e1116;overflow:hidden;}
  *{ -webkit-tap-highlight-color:transparent; }
  #game{width:100vw;height:100vh;}
  #rotate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;
    background:#0e1116;color:#cdd6e3;font-family:-apple-system,system-ui,sans-serif;text-align:center;z-index:10;}
  #rotate b{font-size:20px;font-weight:800;} #rotate span{color:#7c879c;font-size:14px;}
  @media (orientation:portrait){ #rotate{display:flex;} #game{visibility:hidden;} }
</style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate"><b>↻ Rotate to landscape</b><span>for the poker table</span></div>
  <script src="phaser.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
