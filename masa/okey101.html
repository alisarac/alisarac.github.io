<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Masaya davet · Müdavim Okey 101</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,SOFT,WONK,wght@9..144,0..100,0..1,400..900&family=Source+Serif+4:opsz,wght@8..60,400..600&display=swap">
<link rel="stylesheet" href="/site.css">
<style>
  /* An invitation to an online table. One page per game (masa/<game>.html,
     the GAME block in the script below), so each app claims its own path:
     with the app installed the link never lands here (Android opens it —
     .well-known/assetlinks.json); without it, Android goes straight to
     Google Play; elsewhere the page shows the code. */
  .invite { max-width: 30rem; margin: 12vh auto 4rem; padding: 0 1rem; text-align: center; }
  .invite h1 { font-family: var(--display, inherit); font-size: 1.7rem; margin: 0 0 .4rem; }
  .invite, .invite * { box-sizing: border-box; overflow-wrap: anywhere; }
  .invite p { color: var(--ink-soft); line-height: 1.5; margin: .4rem 0; }
  .code { font-family: var(--display, inherit); font-size: 2.6rem; font-weight: 800; letter-spacing: .35em; margin: 1.2rem 0 .2rem; padding-left: .35em; }
  .label { font-size: .8rem; color: var(--ink-soft); }
  .open { display: inline-block; margin: 1.4rem 0 .6rem; padding: .85rem 1.6rem; border-radius: 12px;
          background: #2f6b4f; color: #fff; font-weight: 700; text-decoration: none; }
  .badge img { height: 56px; margin-top: .6rem; }
  .steps { text-align: left; margin: 1.6rem auto 0; max-width: 24rem; }
  .steps li { margin: .35rem 0; color: var(--ink-soft); }
</style>
</head>
<body>
<main class="invite">
  <h1 data-tr="Masaya davet edildin" data-en="You're invited to a table">Masaya davet edildin</h1>
  <p data-tr="{game}'de bir arkadaşın seni masasına çağırıyor. Şimdilik Android'de."
     data-en="A friend is calling you to their table in {game}. Android for now.">Müdavim Okey 101'de bir arkadaşın seni masasına çağırıyor.</p>
  <div class="code" id="code">·····</div>
  <div class="label" data-tr="masa kodu" data-en="table code">masa kodu</div>
  <a class="open" id="open" href="#" data-tr="Uygulamada aç" data-en="Open in the app">Uygulamada aç</a>
  <div><a class="badge" id="play" href="#"><img id="badge" src="/assets/badge/google-play-tr.png" alt="Google Play"></a></div>
  <ol class="steps">
    <li data-tr="{game}'i Google Play'den yükle."
        data-en="Install {game} from Google Play.">Müdavim Okey 101'i Google Play'den yükle.</li>
    <li data-tr="Davet bağlantısına tekrar dokun — ya da uygulamada Online masa → Katıl → kodu yaz."
        data-en="Tap the invitation link again — or in the app: Online table → Join → type the code.">Davet bağlantısına tekrar dokun — ya da uygulamada Online masa → Katıl → kodu yaz.</li>
  </ol>
</main>
<script>
  // The game this page invites to. Copy the page for another game and
  // change only this (and add its package to .well-known/assetlinks.json).
  var GAME = {
    name: 'Müdavim Okey 101',
    android: 'com.alisrc.okey101',
    ios: ''  // App Store id, once there is one
  };
  (function () {
    var raw = (new URLSearchParams(location.search).get('k') || '').toUpperCase();
    var code = /^[A-Z0-9]{5}$/.test(raw) ? raw : '';
    var en = !/^tr/i.test(navigator.language || '');
    document.documentElement.lang = en ? 'en' : 'tr';
    document.querySelectorAll('[data-tr]').forEach(function (el) {
      el.textContent = el.getAttribute(en ? 'data-en' : 'data-tr').replace('{game}', GAME.name);
    });
    document.getElementById('badge').src = '/assets/badge/google-play-' + (en ? 'en' : 'tr') + '.png';
    if (code) document.getElementById('code').textContent = code;
    var play = 'https://play.google.com/store/apps/details?id=' + GAME.android +
      '&referrer=' + encodeURIComponent('utm_source=invite&utm_content=' + code);
    document.getElementById('play').href = play;
    var open = document.getElementById('open');
    var ua = navigator.userAgent;
    if (/Android/i.test(ua)) {
      // With the app, Android would have opened it instead of this page:
      // so the app is missing — straight to Google Play. The button stays
      // for a phone where the link was not verified (it opens the app if
      // it is there after all, else Google Play).
      open.href = 'intent://alisrc.com' + location.pathname + '?k=' + code +
        '#Intent;scheme=https;package=' + GAME.android +
        ';S.browser_fallback_url=' + encodeURIComponent(play) + ';end';
      location.replace(play);
    } else if (/iPhone|iPad|iPod/i.test(ua) && GAME.ios) {
      location.replace('https://apps.apple.com/app/id' + GAME.ios);
    } else {
      open.style.display = 'none';
    }
  })();
</script>
</body>
</html>
