<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e1116">
<title>Hearts</title>
<style>
  :root{ --bg:#0e1116; --panel:#1a1f29; --slot:#1f2532; --ink:#e8ecf4; --muted:#7c879c; --accent:#5ad1c5;
         --card:#f3f0e7; --cardEdge:#cfc9b8; --red:#c2413f; --black:#222836; --back:#39507a; --back2:#2a3c5e; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    overscroll-behavior:none;touch-action:none;user-select:none;}
  #app{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:10px;
    padding:12px env(safe-area-inset-right) calc(12px + env(safe-area-inset-bottom)) env(safe-area-inset-left);}
  header{width:100%;max-width:520px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;}
  .title{font-size:24px;font-weight:800;letter-spacing:.5px;}
  .title small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:2px;}
  #status{font-size:13px;color:var(--accent);font-weight:600;min-height:18px;text-align:right;max-width:200px;}
  #stage{position:relative;width:100%;max-width:520px;}
  canvas{width:100%;display:block;}
  .bar{width:100%;max-width:520px;display:flex;align-items:center;justify-content:flex-end;gap:8px;min-height:40px;}
  button{background:var(--slot);color:var(--ink);border:0;border-radius:12px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;}
  button:active{transform:scale(.97);}
  button:disabled{opacity:.35;}
  #primary{background:var(--accent);color:#0e1116;display:none;}
  #over{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    background:rgba(14,17,22,.82);backdrop-filter:blur(3px);border-radius:12px;text-align:center;padding:20px;}
  #over h2{margin:0;font-size:30px;font-weight:900;color:var(--accent);}
  #over p{margin:0;color:var(--ink);font-size:15px;line-height:1.6;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">Hearts<small>duck · dodge the lady · shoot the moon</small></div>
    <div id="status"></div>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="over"><h2 id="overTitle"></h2><p id="overBody"></p></div>
  </div>
  <div class="bar">
    <button id="primary"></button>
    <button id="newBtn">New game</button>
  </div>
</div>

<script>
(() => {
  "use strict";
  // suit 0=spades,1=hearts,2=diamonds,3=clubs
  const SUIT = ['♠', '♥', '♦', '♣'];
  const rankStr = r => r === 14 ? 'A' : r === 13 ? 'K' : r === 12 ? 'Q' : r === 11 ? 'J' : String(r);
  const isRed = s => s === 1 || s === 2;
  const ri = n => (Math.random() * n) | 0;
  const NAMES = ['You', 'West', 'North', 'East'];          // seat 0..3, play order clockwise
  const pointVal = c => c.s === 1 ? 1 : (c.s === 0 && c.r === 12 ? 13 : 0);
  const isQS = c => c.s === 0 && c.r === 12;

  // ---- DOM ----
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const statusEl = document.getElementById('status'), primary = document.getElementById('primary');
  const overEl = document.getElementById('over'), overTitle = document.getElementById('overTitle'), overBody = document.getElementById('overBody');
  const stage = document.getElementById('stage');

  // ---- state ----
  let hands, taken, scores, trick, turn, leadSuit, heartsBroken, firstTrick;
  let phase, passDir, passSel, aiPass, roundDelta, gen = 0;
  const PASS_LABEL = ['left', 'right', 'across', '— (no pass)'];

  function newGame() {
    scores = [0, 0, 0, 0]; passDir = 0; gen++;
    overEl.style.display = 'none';
    newRound();
  }

  function newRound() {
    gen++;
    const deck = [];
    for (let s = 0; s < 4; s++) for (let r = 2; r <= 14; r++) deck.push({ r, s });
    for (let i = deck.length - 1; i > 0; i--) { const j = ri(i + 1);[deck[i], deck[j]] = [deck[j], deck[i]]; }
    hands = [[], [], [], []];
    for (let i = 0; i < 52; i++) hands[i % 4].push(deck[i]);
    for (const h of hands) h.sort((a, b) => a.s - b.s || a.r - b.r);
    taken = [[], [], [], []]; trick = []; leadSuit = null; heartsBroken = false; firstTrick = true;
    roundDelta = [0, 0, 0, 0]; passSel = []; aiPass = [[], [], [], []];
    if (passDir === 3) { startPlay(); }     // no-pass round
    else { phase = 'pass'; for (let p = 1; p < 4; p++) aiPass[p] = aiSelectPass(p); setStatus(); }
    primaryUpdate(); draw();
  }

  // ---- passing ----
  function aiSelectPass(p) {
    const danger = c => isQS(c) ? 100 : (c.s === 0 && c.r >= 13) ? 70 + c.r : c.s === 1 ? 30 + c.r : c.r;
    return hands[p].slice().sort((a, b) => danger(b) - danger(a)).slice(0, 3);
  }
  function doPass() {
    const sel = [hands[0].filter(c => passSel.includes(c)), aiPass[1], aiPass[2], aiPass[3]];
    const tgt = p => passDir === 0 ? (p + 1) % 4 : passDir === 1 ? (p + 3) % 4 : (p + 2) % 4;
    for (let p = 0; p < 4; p++) for (const c of sel[p]) hands[p].splice(hands[p].indexOf(c), 1);
    for (let p = 0; p < 4; p++) for (const c of sel[p]) hands[tgt(p)].push(c);
    for (const h of hands) h.sort((a, b) => a.s - b.s || a.r - b.r);
    passSel = [];
    startPlay();
    primaryUpdate(); draw();
  }

  function startPlay() {
    phase = 'play';
    for (let p = 0; p < 4; p++) if (hands[p].some(c => c.s === 3 && c.r === 2)) { turn = p; break; }
    setStatus(); step();
  }

  // ---- rules ----
  function legalMoves(p) {
    const hand = hands[p];
    if (trick.length === 0) {
      if (firstTrick) { const two = hand.find(c => c.s === 3 && c.r === 2); if (two) return [two]; }
      if (!heartsBroken) { const nonH = hand.filter(c => c.s !== 1); if (nonH.length) return nonH; }
      return hand.slice();
    }
    const lead = trick[0].card.s;
    const inSuit = hand.filter(c => c.s === lead);
    if (inSuit.length) return inSuit;
    let cand = hand.slice();
    if (firstTrick) { const safe = cand.filter(c => pointVal(c) === 0); if (safe.length) cand = safe; }
    return cand;
  }

  function playCard(p, card) {
    hands[p].splice(hands[p].indexOf(card), 1);
    if (trick.length === 0) leadSuit = card.s;
    if (card.s === 1) heartsBroken = true;
    trick.push({ player: p, card });
    if (trick.length < 4) { turn = (turn + 1) % 4; draw(); step(); }
    else { draw(); schedule(resolveTrick, 850); }
  }

  function resolveTrick() {
    const lead = trick[0].card.s; let win = trick[0];
    for (const t of trick) if (t.card.s === lead && t.card.r > win.card.r) win = t;
    for (const t of trick) taken[win.player].push(t.card);
    trick = []; leadSuit = null; firstTrick = false; turn = win.player;
    if (hands[0].length === 0) { endRound(); return; }
    setStatus(); draw(); step();
  }

  function endRound() {
    const pts = taken.map(cards => cards.reduce((a, c) => a + pointVal(c), 0));
    const shooter = pts.indexOf(26);
    if (shooter >= 0) roundDelta = pts.map((_, p) => p === shooter ? 0 : 26);
    else roundDelta = pts.slice();
    for (let p = 0; p < 4; p++) scores[p] += roundDelta[p];
    phase = 'roundEnd';
    const gameOver = Math.max(...scores) >= 100;
    let body = NAMES.map((n, p) => `${n}: +${roundDelta[p]}  (total ${scores[p]})`).join('\n');
    if (shooter >= 0) body = `🌙 ${NAMES[shooter]} shot the moon!\n\n` + body;
    if (gameOver) {
      const winner = scores.indexOf(Math.min(...scores));
      overTitle.textContent = `${NAMES[winner]} win${winner === 0 ? '' : 's'}!`;
      overBody.textContent = body; overEl.style.display = 'flex'; phase = 'gameEnd';
    } else {
      overTitle.textContent = 'Hand complete'; overBody.textContent = body; overEl.style.display = 'flex';
    }
    primaryUpdate(); setStatus(); draw();
  }
  function nextHand() { overEl.style.display = 'none'; passDir = (passDir + 1) % 4; newRound(); }

  // ---- AI play ----
  function trickWinnerCard() { const lead = trick[0].card.s; let w = trick[0].card; for (const t of trick) if (t.card.s === lead && t.card.r > w.r) w = t.card; return w; }
  function aiPlay(p) {
    const legal = legalMoves(p);
    if (legal.length === 1) return legal[0];
    const low = arr => arr.reduce((a, b) => b.r < a.r ? b : a);
    const high = arr => arr.reduce((a, b) => b.r > a.r ? b : a);
    if (trick.length === 0) {                          // leading: lead low
      const nonPoints = legal.filter(c => pointVal(c) === 0);
      return low(nonPoints.length ? nonPoints : legal);
    }
    const lead = trick[0].card.s;
    const inSuit = legal.filter(c => c.s === lead);
    if (inSuit.length) {
      const winning = trickWinnerCard();
      const below = inSuit.filter(c => c.r < winning.r);
      const last = trick.length === 3;
      const pointsIn = trick.reduce((a, t) => a + pointVal(t.card), 0);
      if (below.length) return high(below);            // duck just under
      if (last && pointsIn === 0) return high(inSuit);  // safe to win a clean trick, dump high
      return low(inSuit);                               // forced to win -> minimise
    }
    const qs = legal.find(isQS); if (qs) return qs;     // void: ditch the Queen
    const hearts = legal.filter(c => c.s === 1); if (hearts.length) return high(hearts);
    const hiSpades = legal.filter(c => c.s === 0 && c.r >= 12); if (hiSpades.length) return high(hiSpades);
    return high(legal);
  }

  // ---- turn driver ----
  function schedule(fn, delay) { const g = gen; setTimeout(() => { if (g === gen) fn(); }, delay); }
  function step() {
    if (phase !== 'play') return;
    if (trick.length === 4) return;
    if (turn === 0) { setStatus(); draw(); return; }     // wait for human
    schedule(() => { if (phase === 'play' && turn !== 0 && trick.length < 4) playCard(turn, aiPlay(turn)); }, 480);
  }

  // ---- status / buttons ----
  function setStatus() {
    if (phase === 'pass') statusEl.textContent = `Pass 3 cards ${PASS_LABEL[passDir]}`;
    else if (phase === 'play') statusEl.textContent = turn === 0 ? 'Your turn' : `${NAMES[turn]} thinking…`;
    else statusEl.textContent = '';
  }
  function primaryUpdate() {
    if (phase === 'pass') { primary.style.display = 'inline-block'; primary.textContent = 'Pass'; primary.disabled = passSel.length !== 3; }
    else if (phase === 'roundEnd') { primary.style.display = 'inline-block'; primary.textContent = 'Next hand'; primary.disabled = false; }
    else primary.style.display = 'none';
  }

  // ---- layout / render ----
  let M = {};
  function metrics() {
    const W = stage.clientWidth || 520;
    const H = Math.round(W * 1.18);
    const cardW = W * 0.132, cardH = cardW * 1.42, m = W * 0.02;
    const handY = H - cardH - m * 1.2;
    const handSpacing = Math.min(cardW * 0.62, (W - 2 * m - cardW) / 12);
    const handStart = (W - (handSpacing * 12 + cardW)) / 2;
    const trickCY = (m + cardH + handY) / 2;
    M = { W, H, cardW, cardH, m, handY, handSpacing, handStart, trickCY, cx: W / 2 };
    const dpr = window.devicePixelRatio || 1;
    if (cv.height !== Math.round(H * dpr)) { cv.style.height = H + 'px'; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  }
  function rr(x, y, w, h, rad) { ctx.beginPath(); ctx.moveTo(x + rad, y); ctx.arcTo(x + w, y, x + w, y + h, rad); ctx.arcTo(x + w, y + h, x, y + h, rad); ctx.arcTo(x, y + h, x, y, rad); ctx.arcTo(x, y, x + w, y, rad); ctx.closePath(); }
  function cardFace(x, y, card, dim, raise, sel) {
    y -= raise || 0;
    rr(x, y, M.cardW, M.cardH, M.cardW * 0.12);
    ctx.globalAlpha = dim ? 0.4 : 1; ctx.fillStyle = '#f3f0e7'; ctx.fill();
    ctx.lineWidth = sel ? 3 : 1; ctx.strokeStyle = sel ? '#5ad1c5' : '#cfc9b8'; ctx.stroke();
    ctx.fillStyle = isRed(card.s) ? '#c2413f' : '#222836'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.font = `800 ${M.cardH * 0.22}px system-ui`; ctx.fillText(rankStr(card.r), x + M.cardW * 0.1, y + M.cardH * 0.06);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `${M.cardH * 0.32}px system-ui`;
    ctx.fillText(SUIT[card.s], x + M.cardW / 2, y + M.cardH * 0.6);
    ctx.globalAlpha = 1;
  }
  function cardBack(x, y, w, h) { rr(x, y, w, h, w * 0.14); ctx.fillStyle = '#39507a'; ctx.fill(); ctx.fillStyle = '#2a3c5e'; rr(x + w * 0.16, y + h * 0.12, w * 0.68, h * 0.76, w * 0.08); ctx.fill(); }

  function opp(p, x, y) {
    const active = phase === 'play' && turn === p;
    const bw = M.cardW * 0.5, bh = bw * 1.42;
    cardBack(x, y, bw, bh);
    ctx.fillStyle = active ? '#5ad1c5' : '#e8ecf4'; ctx.font = '700 13px system-ui'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(`${NAMES[p]}  ${scores[p]}`, x + bw + 8, y + bh * 0.32);
    ctx.fillStyle = '#7c879c'; ctx.font = '12px system-ui';
    ctx.fillText(`${hands[p].length} cards`, x + bw + 8, y + bh * 0.72);
  }

  function draw() {
    metrics();
    ctx.clearRect(0, 0, M.W, M.H);
    // opponents: North top, West left, East right
    opp(2, M.cx - M.cardW * 0.9, M.m);
    opp(1, M.m, M.trickCY - M.cardH * 0.2);
    opp(3, M.W - M.m - M.cardW * 1.9, M.trickCY - M.cardH * 0.2);
    // trick cards by seat
    const cw = M.cardW, ch = M.cardH, cx = M.cx - cw / 2, cy = M.trickCY - ch / 2;
    const seat = { 0: [cx, cy + ch * 0.7], 1: [cx - cw * 0.8, cy], 2: [cx, cy - ch * 0.7], 3: [cx + cw * 0.8, cy] };
    for (const t of trick) { const [x, y] = seat[t.player]; cardFace(x, y, t.card); }
    // your hand
    const legal = (phase === 'play' && turn === 0) ? legalMoves(0) : null;
    for (let i = 0; i < hands[0].length; i++) {
      const c = hands[0][i], x = M.handStart + i * M.handSpacing;
      const selectable = phase === 'pass';
      const isSel = selectable && passSel.includes(c);
      const dim = legal ? !legal.includes(c) : false;
      cardFace(x, M.handY, c, dim, isSel ? 16 : 0, isSel);
    }
  }

  // ---- input ----
  function localXY(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  function handHit(x, y) {
    for (let i = hands[0].length - 1; i >= 0; i--) {
      const cx = M.handStart + i * M.handSpacing;
      const top = M.handY - (passSel.includes(hands[0][i]) ? 16 : 0);
      if (x >= cx && x <= cx + M.cardW && y >= top && y <= top + M.cardH) return i;
    }
    return -1;
  }
  function onTap(x, y) {
    const i = handHit(x, y); if (i < 0) return;
    const card = hands[0][i];
    if (phase === 'pass') {
      const k = passSel.indexOf(card);
      if (k >= 0) passSel.splice(k, 1);
      else if (passSel.length < 3) passSel.push(card);
      primaryUpdate(); draw(); return;
    }
    if (phase === 'play' && turn === 0 && trick.length < 4) {
      if (legalMoves(0).includes(card)) playCard(0, card);
    }
  }
  let downX = null, downY = null;
  cv.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; });
  cv.addEventListener('pointerup', e => { if (downX == null) return; const far = Math.abs(e.clientX - downX) > 12 || Math.abs(e.clientY - downY) > 12; downX = downY = null; if (far) return; const [x, y] = localXY(e); onTap(x, y); });

  primary.addEventListener('click', () => { if (phase === 'pass' && passSel.length === 3) doPass(); else if (phase === 'roundEnd') nextHand(); });
  document.getElementById('newBtn').addEventListener('click', newGame);
  window.addEventListener('resize', draw);

  newGame();
  window.addEventListener('load', draw);
})();
</script>
</body>
</html>
