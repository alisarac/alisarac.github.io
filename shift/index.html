<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e1116">
<title>Shift</title>
<style>
  :root{ --bg:#0e1116; --panel:#1a1f29; --floor:#222836; --wall:#11151c; --ink:#e8ecf4; --muted:#7c879c;
         --accent:#5ad1c5; --box:#c2a05a; --boxon:#56b85a; --goal:#3f6f9e; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    overscroll-behavior:none;touch-action:none;user-select:none;}
  #app{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    padding:16px env(safe-area-inset-right) calc(16px + env(safe-area-inset-bottom)) env(safe-area-inset-left);}
  header{width:100%;max-width:460px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;}
  .title{font-size:28px;font-weight:800;letter-spacing:.5px;}
  .title small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:2px;}
  .scores{display:flex;gap:8px;}
  .score{background:var(--panel);border-radius:12px;padding:8px 14px;text-align:center;min-width:58px;}
  .score .lab{font-size:10px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;}
  .score .val{font-size:22px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;}
  #stage{position:relative;width:100%;max-width:460px;aspect-ratio:1/1;}
  canvas{width:100%;height:100%;display:block;border-radius:14px;background:var(--panel);}
  .bar{width:100%;max-width:460px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .hint{font-size:12px;color:var(--muted);line-height:1.4;}
  .btns{display:flex;gap:8px;}
  button{background:var(--floor);color:var(--ink);border:0;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;}
  button:active{transform:scale(.97);}
  button:disabled{opacity:.4;}
  #won{position:absolute;inset:0;border-radius:14px;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    background:rgba(14,17,22,.72);backdrop-filter:blur(2px);}
  #won h2{margin:0;font-size:34px;font-weight:900;color:var(--accent);text-shadow:0 4px 30px rgba(90,209,197,.5);}
  #won p{margin:0;color:var(--muted);}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">Shift<small>push · plan · don't get stuck</small></div>
    <div class="scores">
      <div class="score"><div class="lab">Level</div><div class="val" id="level">1</div></div>
      <div class="score"><div class="lab">Moves</div><div class="val" id="moves">0</div></div>
      <div class="score"><div class="lab">Best</div><div class="val" id="best">1</div></div>
    </div>
  </header>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="won"><h2>Solved!</h2><p id="wonSub">Next level…</p></div>
  </div>

  <div class="bar">
    <div class="hint">Swipe (or arrow keys) to move. Push boxes onto the targets.<br>You can only <b>push</b> — a box in a corner is stuck.</div>
    <div class="btns">
      <button id="undoBtn">Undo</button>
      <button id="resetBtn">Restart</button>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";
  const K = (r, c) => r * 16 + c;
  const KR = k => (k / 16) | 0, KC = k => k % 16;
  const ri = n => (Math.random() * n) | 0;
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = ri(i + 1);[a[i], a[j]] = [a[j], a[i]]; } return a; };
  const DIRS = [[-1, 0], [1, 0], [0, -1], [0, 1]];

  // ---- generator (reverse pulls; verified solvable by construction) ----
  function scramble(G, goals, steps) {
    const isWall = (r, c) => r <= 0 || c <= 0 || r >= G - 1 || c >= G - 1;
    const boxes = new Set(goals.map(([r, c]) => K(r, c)));
    let pr, pc; do { pr = 1 + ri(G - 2); pc = 1 + ri(G - 2); } while (boxes.has(K(pr, pc)));
    let pulls = 0;
    for (let i = 0; i < steps; i++) {
      for (const [dr, dc] of shuffle(DIRS)) {
        const nr = pr + dr, nc = pc + dc;
        if (isWall(nr, nc) || boxes.has(K(nr, nc))) continue;
        const br = pr - dr, bc = pc - dc;
        if (boxes.has(K(br, bc)) && Math.random() < 0.75) { boxes.delete(K(br, bc)); boxes.add(K(pr, pc)); pulls++; }
        pr = nr; pc = nc; break;
      }
    }
    return { boxes: [...boxes], player: [pr, pc], pulls };
  }
  function genShift(level) {
    const G = 6 + Math.min(2, Math.floor(level / 6));
    const nBoxes = Math.min(2 + Math.floor(level / 4), 4);
    const steps = 12 + level * 4;
    let best = null, bestScore = -1;
    for (let a = 0; a < 80; a++) {
      const gset = new Set(), goals = [];
      while (goals.length < nBoxes) { const r = 1 + ri(G - 2), c = 1 + ri(G - 2); if (!gset.has(K(r, c))) { gset.add(K(r, c)); goals.push([r, c]); } }
      const { boxes, player, pulls } = scramble(G, goals, steps);
      if (pulls < nBoxes) continue;
      const offGoal = boxes.filter(b => !gset.has(b)).length;
      if (offGoal === 0) continue;
      const score = offGoal * 100 + pulls;
      if (score > bestScore) { bestScore = score; best = { G, goals: goals.map(([r, c]) => K(r, c)), boxes, player }; }
    }
    return best || genShift(1);
  }

  // ---- DOM ----
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const levelEl = document.getElementById('level'), movesEl = document.getElementById('moves'), bestEl = document.getElementById('best');
  const undoBtn = document.getElementById('undoBtn'), resetBtn = document.getElementById('resetBtn');
  const wonEl = document.getElementById('won'), wonSub = document.getElementById('wonSub'), stage = document.getElementById('stage');

  // ---- state ----
  let level = 1, best = +(localStorage.getItem('shift_best') || 1);
  let G, goals, boxes, start, pr, pc, moves, history, solved;
  let anim = null;   // {pr0,pc0,pr1,pc1, box?:{r0,c0,r1,c1,key}, t}
  bestEl.textContent = best;

  let cell = 0, px = 0;
  function layout() {
    const w = stage.clientWidth || 460; px = w; cell = w / G;
    const dpr = window.devicePixelRatio || 1;
    cv.width = w * dpr; cv.height = w * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  const isWall = (r, c) => r <= 0 || c <= 0 || r >= G - 1 || c >= G - 1;

  function loadLevel(n) {
    const L = genShift(n);
    G = L.G; goals = new Set(L.goals); boxes = new Set(L.boxes);
    [pr, pc] = L.player; start = { boxes: [...boxes], player: [pr, pc] };
    moves = 0; history = []; solved = false; anim = null;
    levelEl.textContent = n; movesEl.textContent = 0;
    wonEl.style.display = 'none'; undoBtn.disabled = true;
    layout(); draw();
  }

  function snapshot() { history.push({ boxes: new Set(boxes), pr, pc, moves }); if (history.length > 500) history.shift(); undoBtn.disabled = false; }

  function move(dr, dc) {
    if (solved || anim) return;
    const nr = pr + dr, nc = pc + dc;
    if (isWall(nr, nc)) return;
    let boxAnim = null;
    if (boxes.has(K(nr, nc))) {
      const br = nr + dr, bc = nc + dc;
      if (isWall(br, bc) || boxes.has(K(br, bc))) return;       // box blocked -> no move
      snapshot();
      boxes.delete(K(nr, nc)); boxes.add(K(br, bc));
      boxAnim = { r0: nr, c0: nc, r1: br, c1: bc, key: K(br, bc) };
    } else {
      snapshot();
    }
    const pr0 = pr, pc0 = pc; pr = nr; pc = nc;
    moves++; movesEl.textContent = moves;
    anim = { pr0, pc0, pr1: pr, pc1: pc, box: boxAnim, t: 0 };
    animate(80, p => { anim.t = p; }, () => { anim = null; draw(); checkWin(); });
  }

  function undo() {
    if (!history.length || solved || anim) return;
    const h = history.pop();
    boxes = h.boxes; pr = h.pr; pc = h.pc; moves = h.moves;
    movesEl.textContent = moves; undoBtn.disabled = history.length === 0; draw();
  }

  function checkWin() {
    for (const g of goals) if (!boxes.has(g)) return;
    solved = true;
    best = Math.max(best, level + 1); bestEl.textContent = best; localStorage.setItem('shift_best', best);
    wonSub.textContent = `Solved in ${moves} moves · next…`;
    wonEl.style.display = 'flex';
    setTimeout(() => { level += 1; loadLevel(level); }, 1100);
  }

  // ---- animation ----
  function animate(dur, step, done) {
    const t0 = performance.now();
    (function f(now) { let p = (now - t0) / dur; if (p > 1) p = 1; step(p); draw(); p < 1 ? requestAnimationFrame(f) : done && done(); })(performance.now());
  }
  const easeOut = p => 1 - Math.pow(1 - p, 2);

  // ---- render ----
  function rr(x, y, w, h, rad) {
    ctx.beginPath(); ctx.moveTo(x + rad, y);
    ctx.arcTo(x + w, y, x + w, y + h, rad); ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad); ctx.arcTo(x, y, x + w, y, rad); ctx.closePath();
  }
  function draw() {
    if (!cell) return;
    ctx.clearRect(0, 0, px, px);
    for (let r = 0; r < G; r++) for (let c = 0; c < G; c++) {
      const x = c * cell, y = r * cell;
      ctx.fillStyle = isWall(r, c) ? '#11151c' : '#222836';
      ctx.fillRect(x, y, cell + 0.5, cell + 0.5);
    }
    // goals
    for (const g of goals) {
      const x = KC(g) * cell, y = KR(g) * cell, cx = x + cell / 2, cy = y + cell / 2;
      ctx.strokeStyle = '#5a8fd1'; ctx.lineWidth = Math.max(2, cell * 0.06);
      ctx.beginPath(); ctx.arc(cx, cy, cell * 0.17, 0, Math.PI * 2); ctx.stroke();
    }
    // boxes (skip the one being animated; drawn separately)
    const animKey = anim && anim.box ? anim.box.key : -1;
    for (const b of boxes) {
      if (b === animKey) continue;
      drawBox(KC(b) * cell, KR(b) * cell, goals.has(b));
    }
    if (anim && anim.box) {
      const e = easeOut(anim.t);
      const x = (anim.box.c0 + (anim.box.c1 - anim.box.c0) * e) * cell;
      const y = (anim.box.r0 + (anim.box.r1 - anim.box.r0) * e) * cell;
      drawBox(x, y, goals.has(anim.box.key));
    }
    // player
    let px0, py0;
    if (anim) { const e = easeOut(anim.t);
      px0 = (anim.pc0 + (anim.pc1 - anim.pc0) * e) * cell; py0 = (anim.pr0 + (anim.pr1 - anim.pr0) * e) * cell; }
    else { px0 = pc * cell; py0 = pr * cell; }
    ctx.fillStyle = '#5ad1c5'; ctx.shadowColor = '#5ad1c5'; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(px0 + cell / 2, py0 + cell / 2, cell * 0.30, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
  }
  function drawBox(x, y, onGoal) {
    const pad = cell * 0.12, s = cell - pad * 2;
    ctx.fillStyle = onGoal ? '#56b85a' : '#c2a05a';
    rr(x + pad, y + pad, s, s, s * 0.16); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    rr(x + pad + s * 0.2, y + pad + s * 0.2, s * 0.6, s * 0.6, s * 0.1); ctx.fill();
  }

  // ---- input ----
  const keyMap = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1], w: [-1, 0], s: [1, 0], a: [0, -1], d: [0, 1] };
  window.addEventListener('keydown', e => {
    if (e.key === 'z' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); undo(); return; }
    const m = keyMap[e.key]; if (m) { e.preventDefault(); move(m[0], m[1]); }
  });
  let sx = null, sy = null;
  cv.addEventListener('touchstart', e => { const t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  cv.addEventListener('touchend', e => {
    if (sx == null) return; const t = e.changedTouches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy; sx = sy = null;
    if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
    if (Math.abs(dx) > Math.abs(dy)) move(0, dx > 0 ? 1 : -1); else move(dy > 0 ? 1 : -1, 0);
  }, { passive: true });

  undoBtn.addEventListener('click', undo);
  resetBtn.addEventListener('click', () => { if (!solved) { boxes = new Set(start.boxes); [pr, pc] = start.player; moves = 0; movesEl.textContent = 0; history = []; undoBtn.disabled = true; anim = null; draw(); } });
  window.addEventListener('resize', () => { layout(); draw(); });

  // ---- boot ----
  loadLevel(level);
  window.addEventListener('load', () => { layout(); draw(); });
})();
</script>
</body>
</html>
